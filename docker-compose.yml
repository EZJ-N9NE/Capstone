services:
  db:
    image: postgis/postgis:16-3.4
    container_name: happnhub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: happnhub
      POSTGRES_PASSWORD: happnhub
      POSTGRES_DB: happnhub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U happnhub -d happnhub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
