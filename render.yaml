# Render Blueprint for HappnHub
# Creates: a Postgres database, the Express API, and the React static site.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: happnhub-db
    plan: free
    region: oregon
    databaseName: happnhub
    user: happnhub
    postgresMajorVersion: "16"

services:
  # Express API (server/)
  - type: web
    name: happnhub-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: happnhub-db
          property: connectionString
      - key: TICKETMASTER_API_KEY
        sync: false # you'll be prompted for this in the dashboard
      - key: MAPBOX_TOKEN
        sync: false

  # React + Vite frontend (client/)
  - type: web
    name: happnhub-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_MAPBOX_TOKEN
        sync: false
    routes:
      # Forward API calls to the Express service so the client can keep using /api/...
      # If Render gives the API a different URL (e.g. happnhub-api-xxxx.onrender.com), update this.
      - type: rewrite
        source: /api/*
        destination: https://happnhub-api.onrender.com/api/*
      # Single-page app fallback
      - type: rewrite
        source: /*
        destination: /index.html
